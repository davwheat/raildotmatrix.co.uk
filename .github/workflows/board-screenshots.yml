name: Board screenshots

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Baselines are regenerated and committed back to the branch under test.
permissions:
  contents: write

env:
  NODE_VERSION: 24.x

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    name: Regenerate board screenshots

    # A pull request from a fork cannot be pushed to, so there is nothing to commit the result of.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Check out the branch itself rather than the merge commit, so the baselines can be pushed back to it.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      - name: Use Go
        uses: actions/setup-go@v7
        with:
          go-version-file: led-board/go.mod
          cache-dependency-path: led-board/go.sum

      - name: Use Just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Regenerate baselines
        # Two captures per case, so a board caught mid-animation fails the job instead of being committed as the
        # baseline every later run is compared against.
        run: pnpm test:visual --update --repeat 2
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Regenerate LED board goldens
        # The Daktronics and Infotec boards are drawn by the Go program, which renders every fixture and option into
        # images of its own without a browser.
        working-directory: led-board
        run: go test ./internal/formats -run TestGolden -update

      - name: Commit any changes
        run: |
          # Staged first: a board whose baseline has never been recorded produces an untracked file, which an
          # unstaged diff cannot see, so a new case would otherwise be reported as unchanged and never committed.
          # Staging the directories also stages the deletion of an image whose case was removed.
          git add tests/visual/baselines ../led-board/internal/formats/testdata/golden

          if git diff --cached --quiet -- tests/visual/baselines ../led-board/internal/formats/testdata/golden; then
            echo "Board screenshots are unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "Board screenshots updated:"
            echo
            git diff --cached --name-status -- tests/visual/baselines ../led-board/internal/formats/testdata/golden | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update board screenshots'
          git push

      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: board-screenshot-failures
          path: website/tests/visual/failures
          if-no-files-found: ignore
