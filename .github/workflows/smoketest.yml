name: Smoketest

on:
  push:
    branches:
      - main
      - deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  deployments: write
  pull-requests: write

# A slower build must not replace a newer deployment of the same branch.
concurrency:
  group: pages-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.x
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  smoketest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    name: Test, build and deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Find existing build status comment
        continue-on-error: true
        uses: peter-evans/find-comment@v4
        if: github.event_name == 'pull_request'
        id: find_status_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Deploying with

      - name: Create or update comment
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v5
        if: github.event_name == 'pull_request'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find_status_comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## Deploying with &nbsp;<a href="https://pages.dev"><img alt="Cloudflare Pages" src="https://user-images.githubusercontent.com/23264/106598434-9e719e00-654f-11eb-9e59-6167043cfa01.png" width="16"></a> &nbsp;Cloudflare Pages

            <table><tr><td><strong>Latest commit:</strong> </td><td>
            <code>${{  github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}</code>
            </td></tr>
            <tr><td><strong>Status:</strong></td><td>
            &nbsp;⚡️&nbsp; Build in progress...
            </td></tr>
            </table>

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Use Go
        uses: actions/setup-go@v7
        with:
          go-version-file: led-board/go.mod
          cache-dependency-path: led-board/go.sum

      - name: Use Just
        uses: extractions/setup-just@v4

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Verify formatting
        run: pnpm format:check

      - name: Test the LED board
        working-directory: led-board
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go vet ./...
          go test ./...

      - name: Upload LED board golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: led-board-golden-failures
          path: led-board/build/golden-failures
          if-no-files-found: ignore

      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: ./website/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('website/pnpm-lock.yaml') }}-${{ hashFiles('website/src/**/*.ts', 'website/src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('website/pnpm-lock.yaml') }}-

      - name: Build site
        run: pnpm build:ci
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./website/out

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        id: cf-pages-upload
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          # The project name and output directory come from wrangler.toml. Use the PR head branch if there is
          # one, otherwise the current branch.
          command: pages deploy --branch=${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Find existing build status comment
        continue-on-error: true
        uses: peter-evans/find-comment@v4
        if: github.event_name == 'pull_request'
        id: find_current_status_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: ${{  github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Update comment
        continue-on-error: true
        if: github.event_name == 'pull_request' && steps.find_current_status_comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find_current_status_comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## Deploying with &nbsp;<a href="https://pages.dev"><img alt="Cloudflare Pages" src="https://user-images.githubusercontent.com/23264/106598434-9e719e00-654f-11eb-9e59-6167043cfa01.png" width="16"></a> &nbsp;Cloudflare Pages

            <table><tr><td><strong>Latest commit:</strong> </td><td>
            <code>${{  github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}</code>
            </td></tr>
            <tr><td><strong>Status:</strong></td><td>
            &nbsp;✅&nbsp; Deploy successful!
            </td></tr>
            <tr><td><strong>Preview URL:</strong></td><td>
            <a href='${{ steps.cf-pages-upload.outputs.deployment-url }}'>${{ steps.cf-pages-upload.outputs.deployment-url }}</a>
            </td></tr>
            <tr><td><strong>Branch Preview URL:</strong></td><td>
            <a href='${{ steps.cf-pages-upload.outputs.pages-deployment-alias-url }}'>${{ steps.cf-pages-upload.outputs.pages-deployment-alias-url }}</a>
            </td></tr>
            </table>
