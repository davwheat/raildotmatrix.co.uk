name: DietPi image

on:
  push:
    paths:
      - 'led-board/**'
      - '.gitmodules'
      - '.github/workflows/dietpi-image.yml'
  pull_request:
    paths:
      - 'led-board/**'
      - '.gitmodules'
      - '.github/workflows/dietpi-image.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Both images and the update assets share these binaries, so a board updated over the air runs exactly the
  # bytes in the image of the same build.
  binaries:
    name: Board and manager
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: led-board

    steps:
      - name: Checkout code and LED matrix library
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # The version and build number come from the tags and the commit count.
          fetch-depth: 0

      - name: Use Go
        uses: actions/setup-go@v7
        with:
          go-version-file: led-board/go.mod
          cache-dependency-path: led-board/go.sum

      - name: Use Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Use Just
        uses: extractions/setup-just@v4

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y mtools shellcheck

      - name: Test board and image builder
        run: |
          go test ./...
          shellcheck deploy/dietpi/*.sh
          python3 -B -m unittest discover -s deploy/dietpi -p 'test_*.py' -v

      - name: Cross-compile the board for Debian 13
        run: |
          just ZIG_TARGET=aarch64-linux-gnu.2.41 board
          just manager

      - name: Pack update assets
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ $GITHUB_EVENT_NAME == release ]]; then
            channel=stable
            [[ $PRERELEASE != true ]] || channel=prerelease
            suffix=
          else
            # Development builds share one release, so each build's assets carry its commit.
            channel=development
            suffix=-${GITHUB_SHA::7}
          fi
          go run ./cmd/release build \
            -channel "$channel" -suffix "$suffix" \
            -version "$(just --evaluate VERSION)" -commit "$GITHUB_SHA" -build "$(git rev-list --count HEAD)" \
            -out build/release

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            led-board/build/board
            led-board/build/manage
          if-no-files-found: error
          retention-days: 14

      - name: Upload update assets
        uses: actions/upload-artifact@v7
        with:
          name: update
          path: led-board/build/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  image:
    name: ${{ matrix.name }}
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Raspberry Pi Zero 2 W / 2 / 3 / 4 (64-bit)
            dietpi: RPi234
            variant: rpi234
          # DietPi ships the Pi 5 kernel only in its separate RPi5 image.
          - name: Raspberry Pi 5 / 500 (64-bit)
            dietpi: RPi5
            variant: rpi5
    defaults:
      run:
        working-directory: led-board
    env:
      DIETPI_IMAGE: DietPi_${{ matrix.dietpi }}-ARMv8-Trixie.img
      ARTIFACT: raildotmatrix-dietpi-${{ matrix.variant }}-arm64
      OUTPUT_IMAGE: raildotmatrix-dietpi-${{ matrix.variant }}-arm64.img

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: led-board/build

      - name: Download update assets
        uses: actions/download-artifact@v8
        with:
          name: update
          path: led-board/build/release

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y mtools xz-utils qemu-user-static binfmt-support e2fsprogs util-linux

      - name: Download and verify DietPi
        run: |
          mkdir -p build/dietpi/base build/dietpi/artifacts
          cd build/dietpi/base
          curl --fail --location --retry 3 --remote-name "https://dietpi.com/downloads/images/$DIETPI_IMAGE.xz"
          curl --fail --location --retry 3 --remote-name "https://dietpi.com/downloads/images/$DIETPI_IMAGE.xz.sha256"
          sha256sum --check "$DIETPI_IMAGE.xz.sha256"
          xz --decompress "$DIETPI_IMAGE.xz"

      - name: Create flashable image
        run: |
          python3 deploy/dietpi/build_image.py \
            --base-image "build/dietpi/base/$DIETPI_IMAGE" \
            --board build/board \
            --manager build/manage \
            --manifest "build/release/manifest-${{ matrix.variant }}.json" \
            --output "build/dietpi/$OUTPUT_IMAGE"
          sudo update-binfmts --enable qemu-aarch64
          sudo deploy/dietpi/prepare-image.sh "build/dietpi/$OUTPUT_IMAGE"
          xz -T2 -6 "build/dietpi/$OUTPUT_IMAGE"
          mv "build/dietpi/$OUTPUT_IMAGE.xz" build/dietpi/artifacts/
          cp deploy/dietpi/README.txt build/dietpi/artifacts/README.txt
          {
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'DietPi base image SHA-256:\n'
            cat "build/dietpi/base/$DIETPI_IMAGE.xz.sha256"
            printf 'Board binary SHA-256:\n'
            sha256sum build/board
            sha256sum build/manage
          } > "build/dietpi/artifacts/$ARTIFACT-build-info.txt"
          cd build/dietpi/artifacts
          sha256sum "$OUTPUT_IMAGE.xz" > "$OUTPUT_IMAGE.xz.sha256"

      - name: Upload image and flashing instructions
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: led-board/build/dietpi/artifacts/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release:
    name: Upload release assets
    needs: image
    # The dev release belongs to the dev-release job. Publishing it by hand must not attach full images to it.
    if: github.event_name == 'release' && github.event.release.tag_name != 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only the upload jobs need permission to modify releases.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: led-board

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Go
        uses: actions/setup-go@v7
        with:
          go-version-file: led-board/go.mod
          cache-dependency-path: led-board/go.sum

      - name: Download the images built from the release tag
        uses: actions/download-artifact@v8
        with:
          pattern: raildotmatrix-dietpi-*-arm64
          path: artifacts
          # Every image ships the same README.txt, so merging leaves one copy.
          merge-multiple: true

      - name: Download update assets
        uses: actions/download-artifact@v8
        with:
          name: update
          path: led-board/build/release

      - name: Upload image, checksum and instructions to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        # Re-running a failed upload replaces any matching assets already uploaded.
        run: gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" ../artifacts/*

      - name: Sign update manifests
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: go run ./cmd/release sign build/release/manifest-*.json

      # Boards read a manifest before the assets it lists, so the manifests go last.
      - name: Upload update assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s extglob
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" build/release/!(manifest-*)
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" build/release/manifest-*

  dev-release:
    name: Publish development build
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    # Runs one at a time. publish-dev-release.sh also refuses to replace a newer build with an older one.
    concurrency:
      group: dev-release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: led-board

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Go
        uses: actions/setup-go@v7
        with:
          go-version-file: led-board/go.mod
          cache-dependency-path: led-board/go.sum

      - name: Download update assets
        uses: actions/download-artifact@v8
        with:
          name: update
          path: led-board/build/release

      - name: Sign update manifests
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: go run ./cmd/release sign build/release/manifest-*.json

      - name: Publish to the dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: deploy/dietpi/publish-dev-release.sh build/release
